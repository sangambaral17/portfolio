name: Portfolio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  verify:
    name: Build and validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build generated pages
        run: python scripts/build.py
      - name: Check routes, metadata, internal links and disclosure boundaries
        run: python scripts/check.py
